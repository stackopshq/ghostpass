name: Renovate

# Remplace Dependabot, qui est propre à GitHub et donc inerte depuis le passage sur Gitea.
# Renovate tourne ici en self-hosted, dans un job planifié, et ouvre ses PR sur cette instance.
#
# Prérequis : un secret `RENOVATE_TOKEN` contenant un PAT Gitea avec les scopes
# `read:user`, `write:issue` et `write:repository` (droit d'ouvrir des PR sur ce dépôt).
# Le jeton auto-injecté par Gitea Actions ne suffit pas : Renovate doit pousser des branches
# et ouvrir des PR en tant qu'utilisateur.
#
# Configuration des mises à jour : `renovate.json` à la racine.

on:
  schedule:
    # Lundi 5h UTC, avant la fenêtre `before 6am on monday` de renovate.json (Europe/Zurich).
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mettre 'full' pour un passage à blanc (aucune PR créée)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

# ─── Pourquoi `devcontainer` et non `ubuntu-latest` ───
#
# `ubuntu-latest` ne désigne rien par soi-même sur une forge auto-hébergée : c'est une
# étiquette que portait l'exécuteur `core-run-01-runner-1`, et cette machine est hors ligne
# (son hôte `core-run-01-host-1` aussi). Aucun exécuteur en ligne ne la porte, donc ces
# travaux ne pouvaient pas être pris : relancés le 2026-10-24, ils sont restés en file une
# demi-heure sur la mention « Waiting to run ».
#
# Ce que ça donnait à lire est le vrai piège : les dix contrôles de trois pull requests
# étaient **rouges**, mention `Canceled after 0s`. Une annulation s'affiche comme un échec,
# et on lit « le code est cassé » là où il faut lire « rien n'a tourné ». Pourquoi ces
# exécutions-là ont fini annulées plutôt que simplement en attente n'est pas établi — la
# garde de concurrence n'explique pas le cas `push` contre `pull_request`, qui tombent dans
# deux groupes distincts, comme le dit le job iOS plus bas.
#
# `devcontainer` est l'étiquette de `core-run-02-runner-1`, le seul exécuteur en ligne.
# C'est déjà celle de ghostcal, pour la même raison.
#
# Les travaux posent eux-mêmes leur outillage (`dtolnay/rust-toolchain`, `actions/setup-node`),
# donc ils ne dépendent pas de ce que l'image porte d'avance. Le job `image` garde
# `[self-hosted, linux, x64]` : il lui faut un podman réel, non imbriqué — c'est dit sur place.
jobs:
  renovate:
    name: Mise à jour des dépendances
    runs-on: devcontainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Renovate met à jour Cargo.lock en appelant `cargo update` : sans toolchain Rust dans
      # l'image du runner, chaque dépendance cargo part en `spawn cargo ENOENT` et fait échouer
      # le job (22 rejets non gérés au premier essai).
      - uses: dtolnay/rust-toolchain@stable
      - name: Renovate
        run: |
          if [[ -z "${RENOVATE_TOKEN}" ]]; then
            echo "::error::Secret RENOVATE_TOKEN manquant (PAT Gitea autorisé à ouvrir des PR)"
            exit 1
          fi
          if [[ -z "${GITHUB_COM_TOKEN}" ]]; then
            echo "::warning::GH_COM_TOKEN absent : les dépendances hébergées sur github.com" \
                 "(actions, node, python) seront limitées par le rate-limit anonyme et leurs" \
                 "mises à jour ne seront pas détectées."
          fi
          # Un dry-run manuel doit montrer ce qui serait proposé même hors de la fenêtre
          # hebdomadaire de renovate.json, sinon il ne renvoie rien 6 jours sur 7.
          if [[ -n "${RENOVATE_DRY_RUN}" ]]; then
            export RENOVATE_FORCE='{"schedule":null}'
            echo "Dry-run : fenêtre de planification ignorée."
          fi
          npx --yes renovate@44.45.0
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Lookups et changelogs des dépendances github.com. Sans ce jeton, Renovate tape
          # l'API en anonyme et se fait limiter : 41 des 83 dépendances du dépôt sont concernées.
          GITHUB_COM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://git.stackops.ch/api/v1
          RENOVATE_REPOSITORIES: stackops/ghostpass
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@stackops.ch>"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dry_run }}
          LOG_LEVEL: info
