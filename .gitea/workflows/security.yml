name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hebdomadaire : capte les nouvelles advisories sur des dépendances figées.
    # Gitea n'évalue les `schedule` que sur la branche par défaut.
    - cron: "0 6 * * 1"

# Voir la note sur `permissions` dans ci.yml.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# ─── Pourquoi `devcontainer` et non `ubuntu-latest` ───
#
# `ubuntu-latest` ne désigne rien par soi-même sur une forge auto-hébergée : c'est une
# étiquette que portait l'exécuteur `core-run-01-runner-1`, et cette machine est hors ligne
# (son hôte `core-run-01-host-1` aussi). Aucun exécuteur en ligne ne la porte, donc ces
# travaux ne pouvaient pas être pris : relancés le 2026-10-24, ils sont restés en file une
# demi-heure sur la mention « Waiting to run ».
#
# Ce que ça donnait à lire est le vrai piège : les dix contrôles de trois pull requests
# étaient **rouges**, mention `Canceled after 0s`. Une annulation s'affiche comme un échec,
# et on lit « le code est cassé » là où il faut lire « rien n'a tourné ». Pourquoi ces
# exécutions-là ont fini annulées plutôt que simplement en attente n'est pas établi — la
# garde de concurrence n'explique pas le cas `push` contre `pull_request`, qui tombent dans
# deux groupes distincts, comme le dit le job iOS plus bas.
#
# `devcontainer` est l'étiquette de `core-run-02-runner-1`, le seul exécuteur en ligne.
# C'est déjà celle de ghostcal, pour la même raison.
#
# Les travaux posent eux-mêmes leur outillage (`dtolnay/rust-toolchain`, `actions/setup-node`),
# donc ils ne dépendent pas de ce que l'image porte d'avance. Le job `image` garde
# `[self-hosted, linux, x64]` : il lui faut un podman réel, non imbriqué — c'est dit sur place.
jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: devcontainer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour scanner tous les commits
      - name: Scan
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  deps:
    name: Vulns dépendances (osv-scanner)
    runs-on: devcontainer
    steps:
      - uses: actions/checkout@v4
      - name: Scan des lockfiles (Cargo.lock + package-lock.json)
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --recursive --skip-git .

  cargo-audit:
    name: Advisories Rust (cargo-audit)
    runs-on: devcontainer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sast:
    name: SAST (Semgrep)
    runs-on: devcontainer
    # Pas de `container: semgrep/semgrep` ici : Gitea Actions (act) exécute les actions JS avec le
    # `node` du conteneur de job, or l'image Semgrep n'en contient pas, si bien que `actions/checkout` y
    # échouait en exit 127 (« executable file `node` not found »). Semgrep est donc installé dans
    # l'image standard du runner.
    steps:
      - uses: actions/checkout@v4

      # ─── `uv` et non `actions/setup-python` ───
      #
      # `setup-python` ne configure pas un Python : il **télécharge** une version
      # préfabriquée depuis `actions/python-versions`, et il n'en existe pas pour
      # l'image de cet exécuteur. L'erreur le dit sans le dire : « The version '3.12'
      # with architecture 'x64' was not found for this operating system ».
      #
      # `uv` apporte son propre interpréteur et c'est déjà l'outil de la suite — c'est
      # ainsi que ghostcal installe le sien sur ce même exécuteur. La version est
      # épinglée et non « latest » : sans jeton GitHub, `setup-uv` interroge l'API
      # anonymement pour connaître la dernière release, et cette requête a déjà rendu
      # `API rate limit exceeded` sur une IP publique partagée.
      - name: Installation d'uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          enable-cache: true

      # `uv tool run` et non `uv tool install` puis `semgrep` : l'installation pose le
      # binaire dans `~/.local/bin`, dont la présence dans le `PATH` dépend de la version
      # de `setup-uv`. Un job qui échoue sur « command not found » après une installation
      # réussie coûte une demi-heure à comprendre.
      - name: Analyse statique (règles sécurité + secrets + JS/TS)
        # Les `p/...` sont téléchargés depuis le registre semgrep.dev : le runner doit y accéder.
        run: >
          uv tool run --from semgrep==1.174.0
          semgrep scan --error --skip-unknown-extensions
          --config p/security-audit
          --config p/secrets
          --config p/javascript
          --config p/typescript

  # Pas d'équivalent CodeQL sur Gitea : le SAST reste couvert par Semgrep ci-dessus.
