name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hebdomadaire : capte les nouvelles advisories sur des dépendances figées.
    # Gitea n'évalue les `schedule` que sur la branche par défaut.
    - cron: "0 6 * * 1"

# Voir la note sur `permissions` dans ci.yml.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour scanner tous les commits
      - name: Scan
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  deps:
    name: Vulns dépendances (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan des lockfiles (Cargo.lock + package-lock.json)
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --recursive --skip-git .

  cargo-audit:
    name: Advisories Rust (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Pas de `container: semgrep/semgrep` ici : Gitea Actions (act) exécute les actions JS avec le
    # `node` du conteneur de job, or l'image Semgrep n'en contient pas, si bien que `actions/checkout` y
    # échouait en exit 127 (« executable file `node` not found »). Semgrep est donc installé dans
    # l'image standard du runner.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de Semgrep
        run: pip install --disable-pip-version-check semgrep==1.174.0
      - name: Analyse statique (règles sécurité + secrets + JS/TS)
        # Les `p/...` sont téléchargés depuis le registre semgrep.dev : le runner doit y accéder.
        run: >
          semgrep scan --error --skip-unknown-extensions
          --config p/security-audit
          --config p/secrets
          --config p/javascript
          --config p/typescript

  # Pas d'équivalent CodeQL sur Gitea : le SAST reste couvert par Semgrep ci-dessus.
