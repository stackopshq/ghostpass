name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège : lecture seule par défaut. Conservé pour Gitea Actions ; si
# l'instance ne l'applique pas, la portée réelle du jeton (`secrets.GITEA_TOKEN`) est celle
# configurée dans Settings > Actions du dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: Cœur crypto (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (zéro warning)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  server:
    name: Backend (Fastify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test

  web:
    name: Web app (Svelte + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1" # épinglé (reproductibilité ; évite un wasm-pack "latest" cassant)
      - name: Build du paquet WASM (consommé par la web app)
        working-directory: crates/ghostpass-crypto-wasm
        run: wasm-pack build --target web
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Type-check (svelte-check)
        working-directory: apps/web
        run: npm run check
      - name: Build
        working-directory: apps/web
        run: npm run build

  ios:
    name: App iOS (SwiftUI + UniFFI)
    # Xcode et le simulateur n'existent que sur macOS : ce job réclame un runner de cette
    # famille, étiqueté `macos` (voir tools/ci/README.md pour en brancher un).
    #
    # La condition n'est pas un ornement. Un runner self-hosted est une machine réelle :
    # éteinte, en déplacement, ou simplement occupée, elle laisserait le job en file
    # d'attente et la pull request sans verdict — Gitea n'échoue pas, il attend. La
    # variable de dépôt `MACOS_RUNNER` (Settings > Actions > Variables) sert d'interrupteur :
    # à `true` le job tourne, sinon il est ignoré et les tests iOS se lancent à la main.
    if: vars.MACOS_RUNNER == 'true'
    runs-on: macos
    # Le cœur crypto et son binding doivent déjà être verts : sans eux, l'app n'a rien
    # à lier, et un échec ici ne dirait pas où le problème se trouve.
    needs: crypto
    steps:
      - uses: actions/checkout@v4
      # Pas d'action d'installation ici : sur une machine self-hosted, Xcode, rustup,
      # xcodegen et Node sont ceux du poste. On vérifie qu'ils répondent plutôt que de
      # les réinstaller à chaque exécution — et l'absence de l'un doit se lire d'un coup
      # d'œil, pas se deviner trente lignes plus bas.
      - name: Prérequis du poste
        run: |
          set -e
          for outil in xcodebuild xcrun xcodegen cargo node npm; do
            command -v "$outil" >/dev/null || { echo "::error::$outil introuvable sur ce runner"; exit 1; }
          done
          xcodebuild -version | head -1
      - name: Cibles Rust pour iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Dépendances du serveur de test
        working-directory: apps/server
        run: npm ci
      # Construit l'XCFramework et les bindings, monte un serveur GhostPass local, amorce
      # un coffre de test (registre gp:folders compris), déroule les suites, coupe le
      # serveur pour éprouver le hors-ligne, puis remplit un formulaire dans Safari.
      - name: Tests iOS
        run: ./tools/ios/run-ios-tests.sh
      # Un échec ne laisse qu'un nom de test : les rapports portent les captures d'écran
      # et le journal du serveur, seuls moyens de comprendre sans reproduire localement.
      - name: Rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults/
          retention-days: 7

