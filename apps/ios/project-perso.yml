# Variante « équipe personnelle » : l'application seule, sans extension ni habilitations.
#
# Une équipe personnelle (compte Apple gratuit) ne peut pas provisionner le groupe
# d'applications ni le fournisseur d'identifiants — Xcode répond « the selected team does
# not have a program membership that is eligible for this feature ». Le remplissage
# automatique est donc hors de portée jusqu'à la validation du compte payant.
#
# Tout le reste ne l'est pas, et une bonne part ne se vérifie que sur du matériel : la
# vraie biométrie, la réouverture réseau coupé, la mise en page à taille réelle, la mémoire
# contrainte. `SharedStore` retombe sur le conteneur privé quand le groupe manque —
# l'application fonctionne seule, c'est l'extension qui ne verrait rien.
#
#   ./tools/ios/appareil-perso.sh
#
# L'identifiant est suffixé : l'enregistrer sous une équipe personnelle immobiliserait
# `ch.stackops.ghostpass`, qu'il faudra déposer sous l'équipe de l'entreprise. Un App ID
# n'appartient qu'à une équipe à la fois.
include:
  - project.yml

name: GhostpassPerso

# L'extension reste liée — `include` fusionne les listes de dépendances au lieu de les
# remplacer, et l'en retirer demanderait de réécrire la cible entière. Ce n'est pas
# gênant : privée de ses habilitations, elle se compile et s'installe, mais iOS ne la
# proposera jamais. C'est précisément ce qu'on veut ici.
targets:
  Ghostpass:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.stackops.ghostpass.essai
        CODE_SIGN_ENTITLEMENTS: ""
  GhostpassAutoFill:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.stackops.ghostpass.essai.autofill
        CODE_SIGN_ENTITLEMENTS: ""
