# JDK 21 obligatoire. Le JDK 26, installé sur les mêmes postes, casse l'outillage Android :
# son `jlink` échoue sur les modules système. Ce n'est pas un réglage de Gradle, c'est le
# JDK avec lequel on le lance :
#
#   JAVA_HOME=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home ./gradlew …
#
# On ne fige pas `org.gradle.java.home` ici : le chemin est propre à chaque poste, et une
# valeur fausse versionnée coûte plus cher que la ligne d'environnement ci-dessus.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
