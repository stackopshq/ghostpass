# Configuration gitleaks (pre-commit).
# Étend les règles par défaut et ignore les fixtures des fichiers de test : les valeurs
# `EncString` et hash y sont factices (ex. "2.bm9uY2U.Y2lwaGVy" = base64 de "nonce"/"cipher"),
# pas des secrets réels. Le code applicatif reste scanné normalement.

[extend]
useDefault = true

[allowlist]
description = "Fixtures de test (EncStrings/hash factices, non secrets)"
paths = [
  '''apps/server/test/.*\.test\.ts$''',
  '''apps/server/scripts/.*\.ts$''',
  # Lockfiles : hashes d'intégrité et noms de crates ⇒ faux positifs (jamais de secrets).
  '''(^|/)Cargo\.lock$''',
  '''(^|/)package-lock\.json$''',
]

# Vecteur de test de la RFC 6238 (base32 de « 12345678901234567890 », doublé pour atteindre
# 160 bits) : il est publié dans la norme et sert à vérifier que notre TOTP calcule les codes
# attendus. `generic-api-key` le prend pour une clé à cause de son entropie. On autorise la
# valeur elle-même, et non le fichier entier : un vrai secret collé dans les tests iOS doit
# continuer à faire échouer le scan.
regexes = [
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
]
