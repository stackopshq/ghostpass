# Configuration gitleaks (pre-commit).
# Étend les règles par défaut et ignore les fixtures des fichiers de test : les valeurs
# `EncString` et hash y sont factices (ex. "2.bm9uY2U.Y2lwaGVy" = base64 de "nonce"/"cipher"),
# pas des secrets réels. Le code applicatif reste scanné normalement.

[extend]
useDefault = true

[allowlist]
description = "Fixtures de test (EncStrings/hash factices, non secrets)"
paths = [
  '''apps/server/test/.*\.test\.ts$''',
  '''apps/server/scripts/.*\.ts$''',
  # Lockfiles : hashes d'intégrité et noms de crates ⇒ faux positifs (jamais de secrets).
  '''(^|/)Cargo\.lock$''',
  '''(^|/)package-lock\.json$''',
]
# Le secret d'essai de la RFC 6238, autorisé PAR SA VALEUR et non par son
# emplacement. `GEZDGNBVGY3TQOJQ` est le base32 de « 1234567890 » et sa forme
# doublée celui de « 12345678901234567890 », imprimé dans la norme : sans lui,
# les tests TOTP ne prouvent rien, puisque les codes attendus (94287082,
# 07081804…) en dérivent.
#
# Autoriser la valeur plutôt que le répertoire est délibéré. Une allowlist sur
# `apps/ios/Tests/` aurait aussi couvert un vrai secret collé là par accident —
# exactement le cas que ce scan existe pour attraper.
#
# Les deux longueurs sont couvertes : la norme donne le secret sur 20 octets,
# et les tests de durée se contentent des 10 premiers. N'avoir écrit que la
# forme longue laissait passer deux trouvailles — vérifié, pas supposé.
regexes = [
  '''^GEZDGNBVGY3TQOJQ(GEZDGNBVGY3TQOJQ)?$''',
]
