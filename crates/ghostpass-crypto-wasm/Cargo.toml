[package]
name = "ghostpass-crypto-wasm"
# Source unique de la version publiée sur le registre npm de la forge : `wasm-pack`
# recopie ce champ dans `pkg/package.json`, et `publish-wasm.yml` publie ce paquet tel
# quel. Publier une nouvelle version, c'est incrémenter ici — dans une PR, et nulle part
# ailleurs. Le registre refuse d'écraser une version : republier sans incrémenter échoue.
#
# 0.0.1 est déjà en ligne (publiée le 2026-08-26). Le contenu de `crates/` n'a pas bougé
# depuis le 2026-07-01, donc cet arbre décrit bien l'artefact servi sous ce numéro.
version = "0.0.1"
edition.workspace = true
# Explicit string (not inherited from the workspace): some wasm-pack versions don't resolve
# `license.workspace = true` and reject the manifest ("expected a string").
license = "MIT"
publish = false
description = "Binding WASM (web + extension navigateur) du cœur crypto GhostPass"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ghostpass-crypto = { path = "../ghostpass-crypto" }
wasm-bindgen = "0.2"
serde_json = "1"
base64 = "0.22"
# Pour reconstruire une clé publique de membre depuis ses octets (partage d'org).
crypto_box = "0.9.1"
zeroize = "1.9"
# Active le backend JS de getrandom pour la cible wasm32-unknown-unknown
# (source d'entropie = crypto.getRandomValues du navigateur).
getrandom = { version = "0.2", features = ["js"] }
