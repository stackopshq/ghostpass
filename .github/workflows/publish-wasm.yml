name: Publish WASM

# Publie le cœur crypto compilé (`ghostpass-crypto-wasm`) sur GitHub Packages (npm), scope
# @stackopshq, pour que l'extension (et autres clients) en dépendent par version plutôt qu'en
# `file:` cross-repo. Déclenchement manuel avec une version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version npm à publier (ex. 0.0.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"
      - name: Build du paquet WASM
        working-directory: crates/ghostpass-crypto-wasm
        run: wasm-pack build --target web
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@stackopshq"
      - name: Scope + version du paquet généré
        working-directory: crates/ghostpass-crypto-wasm/pkg
        run: |
          npm pkg set name="@stackopshq/ghostpass-crypto-wasm"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
      - name: Publish
        working-directory: crates/ghostpass-crypto-wasm/pkg
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
