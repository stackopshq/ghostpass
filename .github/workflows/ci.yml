name: CI

on:
  push:
    branches: [main]
  pull_request:

# Principe du moindre privilège : lecture seule par défaut.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: Cœur crypto (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (zéro warning)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  server:
    name: Backend (Fastify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test

  web:
    name: Web app (Svelte + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1" # épinglé (reproductibilité ; évite un wasm-pack "latest" cassant)
      - name: Build du paquet WASM (consommé par la web app)
        working-directory: crates/ghostpass-crypto-wasm
        run: wasm-pack build --target web
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Type-check (svelte-check)
        working-directory: apps/web
        run: npm run check
      - name: Build
        working-directory: apps/web
        run: npm run build
