version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/apps/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Garde les actions GitHub à jour (et permet le SHA-pinning ultérieur via PR).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
